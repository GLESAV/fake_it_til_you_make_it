[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitymi"
version = "0.1.0"
description = "Can generated images train a traditional classifier? A controlled study on acne severity grading."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "pyyaml",
    "scipy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "imagehash",
    "torch",
    "torchvision",
]

[project.optional-dependencies]
# Only needed on the GPU host that actually runs generation.
generate = ["diffusers>=0.27", "transformers", "accelerate", "peft", "safetensors", "datasets"]
# Deduplication and the memorisation audit on a face dataset. Optional because the
# authoring sandbox could reach neither the model weights nor the network.
audit = ["insightface", "onnxruntime", "opencv-python"]
# The Gemini arm. Vertex works with application-default credentials; no API key needed.
gemini = ["google-genai"]
dev = ["pytest"]

[project.scripts]
fitymi = "fitymi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
