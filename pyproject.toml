[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitymi"
version = "0.1.0"
description = "Can generated images train a traditional classifier? A controlled study on acne severity grading."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "pyyaml",
    "scipy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "imagehash",
    "torch",
    "torchvision",
]

[project.optional-dependencies]
# Only needed on the GPU host that actually runs generation.
generate = ["diffusers>=0.27", "transformers", "accelerate", "peft", "safetensors"]
dev = ["pytest"]

[project.scripts]
fitymi = "fitymi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
