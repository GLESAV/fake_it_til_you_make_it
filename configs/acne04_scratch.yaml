# The same closed-set arm on a randomly initialised backbone.
#
# This is the arm that actually answers "can generated images train a classifier".
# On ImageNet-pretrained weights a "100% synthetic" arm has still consumed ~1.3M real
# photographs, so the two initialisations are reported separately and never pooled
# (protocol §6.1). Absolute numbers here will be low on ~1.4k images; the comparison
# between arms is the point, not the ceiling.
name: acne04_closed_scratch
output_dir: runs/acne04
final_eval: false

data:
  dataset: acne04
  root: data/acne04
  splits_dir: data/splits_subject
  audit_log: runs/test_unseal_audit.jsonl
  fractions: {train: 0.65, val: 0.15, test: 0.20}
  split_seed: 20260819
  dedup: true
  # Protocol §8.8, mandatory. ACNE04 is ~600 people in 1,457 photographs; an image-level
  # split puts 77% of the test set's faces in the training set too, so a curve measured
  # across one measures memorisation of individuals rather than generalisation.
  subject_grouping: true
  subject_min_cosine: 0.60
  subject_cache: data/splits_subject/face_embeddings.npz

generator:
  source: synth_closed
  pool_dir: data/synthetic/closed
  model_path: runwayml/stable-diffusion-v1-5
  lora_path: models/closed_set_lora
  regime: closed_set
  guidance_scale: 2.0      # see configs/arms/guidance_sweep.yaml
  # 30, not 50. Measured on this machine 50 steps costs 22.63 s/image against 13.78 at
  # 30 -- 39% of the runtime for a step count that is a well-established operating point.
  # Fan et al. and Sariyildiz et al. both generated at 50, so this is a stated deviation.
  # Resolution stays at 512: it is the larger lever (56%) but generating at 384 with a
  # 512-trained LoRA visibly degrades composition and lesion definition
  # (docs/examples/resolution_comparison.png), and lesion definition is the thing under
  # test. Steps are the safe cut; resolution is not.
  steps: 30
  # 4,740 = 5 x the 948-image training budget, allocated across grades in proportion to
  # the real training histogram (1665/2015/630/430).
  #
  # The p=1 arm trains on 948 synthetic images per seed. With five seeds that is 4,740
  # draws, so a pool of exactly that size is the smallest one from which the seeds CAN be
  # disjoint. Anything smaller and the seeds share synthetic images -- at a 3,000-image
  # pool two seeds would overlap on about a third of their training set -- which
  # correlates them and makes the reported seed variance understate the true variance at
  # precisely the arm carrying the headline substitution claim.
  #
  # The committed 20,000 was a placeholder from before the training budget was known.
  n_images: 4740

train:
  arch: resnet50
  init: scratch
  image_size: 224
  batch_size: 32
  epochs: 120        # from scratch needs longer than fine-tuning
  lr: 0.001
  weight_decay: 0.05
  label_smoothing: 0.05
  patience: 25
  num_workers: 8
  seed: 0
  device: auto
  balanced_loss: true
  amp: true

sweep:
  fractions: [0.0, 0.25, 0.5, 0.75, 1.0]
  seeds: [0, 1, 2, 3, 4]
  include_real_subset_controls: true
  include_additive: false
