# Protocol §4.4 — guidance-scale selection.
#
# Classifier-free guidance is a first-order variable for training utility and trades
# fidelity against diversity, so the aesthetic default is the wrong choice for a data
# generator. Each value below produces its own pool; the winner is picked on VALIDATION
# balanced accuracy and nothing else.
#
# The sweep is centred on 2.0, not on the 7.5 default, because two independently
# verified results agree on that optimum (docs/01_related_work.md, both promoted to [V]
# on 2026-08-19):
#
#   Fan et al. 2024 sweep CFG in [1.5, 10.0] for Stable Diffusion and find 2.0 optimal
#   for supervised classifier training.
#   Sariyildiz et al. CVPR 2023 Table 1: on ImageNet-1K, dropping guidance from 7.5 to
#   2.0 moves synthetic-trained top-1 from 26.2% to 42.9% -- 16.7 points, larger than
#   any prompt-engineering effect in that paper.
#
# The old grid {1.5, 3, 5, 7.5, 10} put only one point at or below the expected optimum
# and four above it, which would have spent most of the compute on the wrong side.
#
# Usage: for g in 1.0 1.5 2.0 3.0 5.0; do
#          fitymi generate --config configs/arms/guidance_sweep.yaml \
#            --output-dir runs/guidance_$g   # after setting generator.guidance_scale
#        done
name: acne04_guidance_sweep
output_dir: runs/guidance_sweep   # kept OUT of runs/acne04: selection runs
                                 # must never be pooled into the final analysis
final_eval: false        # never selected on test

data:
  dataset: acne04
  root: data/acne04
  splits_dir: data/splits_subject
  audit_log: runs/test_unseal_audit.jsonl
  split_seed: 20260819
  dedup: true
  # Protocol §8.8, mandatory. ACNE04 is ~600 people in 1,457 photographs; an image-level
  # split puts 77% of the test set's faces in the training set too, so a curve measured
  # across one measures memorisation of individuals rather than generalisation.
  subject_grouping: true
  subject_min_cosine: 0.60
  subject_cache: data/splits_subject/face_embeddings.npz

generator:
  source: synth_closed
  pool_dir: data/synthetic/closed_g3.0
  model_path: runwayml/stable-diffusion-v1-5
  lora_path: models/closed_set_lora
  regime: closed_set
  guidance_scale: 2.0      # see configs/arms/guidance_sweep.yaml
  # 30, not 50. Measured on this machine 50 steps costs 22.63 s/image against 13.78 at
  # 30 -- 39% of the runtime for a step count that is a well-established operating point.
  # Fan et al. and Sariyildiz et al. both generated at 50, so this is a stated deviation.
  # Resolution stays at 512: it is the larger lever (56%) but generating at 384 with a
  # 512-trained LoRA visibly degrades composition and lesion definition
  # (docs/examples/resolution_comparison.png), and lesion definition is the thing under
  # test. Steps are the safe cut; resolution is not.
  steps: 30
  n_images: 5000         # smaller pools suffice for selection

train:
  arch: resnet50
  init: imagenet
  image_size: 224
  epochs: 40
  patience: 10
  num_workers: 8
  seed: 0
  device: auto

sweep:
  fractions: [1.0]       # judge each generator on the fully-synthetic arm
  seeds: [0, 1]
  include_real_subset_controls: false
  include_additive: false
