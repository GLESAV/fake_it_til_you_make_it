# Protocol §5.2 — the additive sweep the exchange rate k(n) is read off.
#
# Synthetic images are nearly free, so the budget-matched design in the main configs
# deliberately understates what they can buy. Here the real budget is held fixed and
# synthetic images are piled on top, at each of four real budgets.
name: acne04_closed_additive
output_dir: runs/acne04
final_eval: false

data:
  dataset: acne04
  root: data/acne04
  splits_dir: data/splits
  audit_log: runs/test_unseal_audit.jsonl
  fractions: {train: 0.65, val: 0.15, test: 0.20}
  split_seed: 20260819
  dedup: true

generator:
  source: synth_closed
  pool_dir: data/synthetic/closed
  model_path: runwayml/stable-diffusion-v1-5
  lora_path: models/closed_set_lora
  regime: closed_set
  guidance_scale: 2.0      # see configs/arms/guidance_sweep.yaml
  steps: 50
  n_images: 40000        # 16x the largest real budget needs a deep pool

train:
  arch: resnet50
  init: imagenet
  image_size: 224
  batch_size: 32
  epochs: 60
  lr: 0.0003
  weight_decay: 0.05
  label_smoothing: 0.05
  patience: 15
  num_workers: 8
  seed: 0
  device: auto
  balanced_loss: true
  amp: true

sweep:
  fractions: [0.0]                 # substitution arms are covered by the main config
  seeds: [0, 1, 2]
  include_real_subset_controls: false
  include_additive: true
  real_budgets: [0.10, 0.25, 0.50, 1.00]
  multipliers: [0, 1, 2, 4, 8, 16]
